<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up - 4ASTORE</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head>
<body>
<header><div class="logo"><h1 class="site-name">4ASTORE</h1><p class="site-slogan">Luxury Branded Watches</p></div></header>
<div class="container">
  <div class="auth-container">
    <h2>Create Account</h2>
    <input id="signupEmail" class="input" placeholder="Email" type="email">
    <input id="signupPhone" class="input" placeholder="Phone">
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="signupOTP" class="input" placeholder="Enter OTP">
      <button class="small" onclick="sendOtp()">Send OTP</button>
    </div>
    <div style="margin-top:10px"><button class="btn" onclick="customerSignup()">Sign Up</button></div>
  </div>
</div>
<footer><div class="footer-bottom">4ASTORE © 2025</div></footer>
</body>
</html>
